<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#005F40">
  <meta name="description" content="КУТ: БИЗНЕС — вход в систему.">
  <title>Вход — КУТ: БИЗНЕС</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --kut-green: #005F40; --kut-green-dark: #003F2A; --kut-green-soft: #E6F1ED;
      --kut-gold: #D4AF37; --kut-gold-dark: #B8952A; --kut-border: #E3EAE6;
      --kut-text: #14211C; --kut-muted: #64776E; --kut-danger: #C0392B;
      --kut-whatsapp: #25D366; --shadow-lg: 0 18px 48px rgba(16,32,25,.20);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #005F40 0%, #003F2A 100%);
      color: var(--kut-text); min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; -webkit-font-smoothing: antialiased;
    }
    #error-banner {
      position: fixed; top: 0; left: 0; right: 0; background: #C0392B; color: #fff;
      padding: 10px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      line-height: 1.4; z-index: 9999; display: none; max-height: 40vh;
      overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    #error-banner.is-visible { display: block; }
    #error-banner strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .auth-card {
      width: 100%; max-width: 460px; background: #fff; border-radius: 24px;
      padding: 28px 26px; box-shadow: var(--shadow-lg);
      animation: cardIn .35s cubic-bezier(.2,.9,.3,1.1);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; justify-content: center; }
    .auth-brand__mark {
      width: 52px; height: 52px; border-radius: 14px; background: var(--kut-green);
      color: var(--kut-gold); display: grid; place-items: center; font-size: 26px;
      font-weight: 800; box-shadow: 0 8px 20px rgba(0,95,64,.30);
    }
    .auth-brand__text { line-height: 1.15; }
    .auth-brand__text strong { display: block; font-size: 20px; font-weight: 800; color: var(--kut-green); letter-spacing: -.3px; }
    .auth-brand__text small { display: block; font-size: 12px; color: var(--kut-muted); margin-top: 2px; }
    .auth-tabs { display: flex; gap: 4px; background: var(--kut-green-soft); padding: 4px; border-radius: 14px; margin-bottom: 18px; }
    .auth-tab {
      flex: 1; padding: 10px 8px; border: none; background: transparent; border-radius: 10px;
      font-family: inherit; font-size: 13px; font-weight: 600; color: var(--kut-muted);
      cursor: pointer; transition: all .18s ease; display: inline-flex; align-items: center;
      justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent;
    }
    .auth-tab:hover { color: var(--kut-green); }
    .auth-tab.is-active { background: #fff; color: var(--kut-green); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .auth-message {
      padding: 12px 14px; border-radius: 12px; font-size: 13px; font-weight: 500;
      margin-bottom: 16px; display: none; line-height: 1.4; word-break: break-word;
    }
    .auth-message.is-error { display: block; background: rgba(192,57,43,.08); color: var(--kut-danger); border: 1px solid rgba(192,57,43,.20); }
    .auth-message.is-success { display: block; background: rgba(30,190,90,.08); color: #0F7F3A; border: 1px solid rgba(30,190,90,.20); }
    .auth-message.is-info { display: block; background: var(--kut-green-soft); color: var(--kut-green); border: 1px solid rgba(0,95,64,.20); }
    .form-field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .form-field label { font-size: 13px; font-weight: 600; color: var(--kut-text); }
    .form-field label .req { color: var(--kut-danger); margin-left: 2px; }
    .form-field input {
      width: 100%; padding: 14px 15px; border: 1.5px solid var(--kut-border);
      border-radius: 12px; font-family: inherit; font-size: 16px; color: var(--kut-text);
      outline: none; background: #fff; transition: border-color .18s ease, box-shadow .18s ease;
    }
    .form-field input:focus { border-color: var(--kut-green); box-shadow: 0 0 0 4px rgba(0,95,64,.12); }
    .form-field input.is-invalid { border-color: var(--kut-danger); box-shadow: 0 0 0 4px rgba(192,57,43,.12); }
    .form-field input.otp-input { text-align: center; letter-spacing: 14px; font-size: 26px; font-weight: 700; padding: 16px 20px 16px 30px; }
    .form-error { font-size: 12px; color: var(--kut-danger); min-height: 14px; font-weight: 500; }
    .auth-btn {
      width: 100%; padding: 15px 18px; border: none; border-radius: 14px;
      background: var(--kut-green); color: #fff; font-family: inherit; font-size: 15px;
      font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(0,95,64,.28);
      transition: background .18s ease, transform .12s ease; margin-top: 8px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .auth-btn:hover { background: var(--kut-green-dark); }
    .auth-btn:active { transform: translateY(1px); }
    .auth-btn:disabled { opacity: .7; cursor: wait; }
    .auth-btn--whatsapp { background: var(--kut-whatsapp); box-shadow: 0 8px 20px rgba(37,211,102,.35); }
    .auth-btn--whatsapp:hover { background: #1EBE5A; }
    .auth-btn--ghost {
      background: transparent; color: var(--kut-green); border: 1.5px solid var(--kut-border);
      box-shadow: none; margin-top: 10px;
    }
    .auth-btn--ghost:hover { background: var(--kut-green-soft); }
    .auth-footer { text-align: center; margin-top: 16px; font-size: 13px; color: var(--kut-muted); line-height: 1.4; }
    .forgot-link { text-align: right; margin-top: -6px; margin-bottom: 8px; }
    .forgot-link button {
      background: transparent; border: none; color: var(--kut-green);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0;
    }
    .diag {
      margin-top: 16px; padding: 10px 12px; background: #F7F9F8;
      border: 1px dashed #C7D4CE; border-radius: 10px;
      font-family: ui-monospace, Menlo, monospace; font-size: 11px;
      color: #4A5C54; line-height: 1.5; word-break: break-word;
      max-height: 200px; overflow-y: auto;
    }
    .version-badge { text-align: center; margin-top: 10px; font-size: 11px; color: var(--kut-muted); font-family: ui-monospace, Menlo, monospace; }
    .hidden { display: none !important; }
    ::selection { background: var(--kut-gold); color: var(--kut-green-dark); }
  </style>
</head>
<body>

  <div id="error-banner" role="alert"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand__mark">К</div>
      <div class="auth-brand__text"><strong>КУТ: БИЗНЕС</strong><small>Вход в систему</small></div>
    </div>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" type="button" data-tab="phone" role="tab" aria-selected="true">📱 По номеру</button>
      <button class="auth-tab" type="button" data-tab="email" role="tab" aria-selected="false">✉️ По Email</button>
    </div>

    <div class="auth-message" id="authMessage"></div>

    <div id="phoneTab">
      <form id="phoneForm" novalidate>
        <div class="form-field">
          <label for="phoneInput">Номер телефона <span class="req">*</span></label>
          <input type="tel" id="phoneInput" placeholder="+996 700 123 456" inputmode="tel" required>
          <div class="form-error" data-for="phoneInput"></div>
        </div>
        <button class="auth-btn auth-btn--whatsapp" type="submit" id="sendOtpBtn">💬 Получить код в WhatsApp</button>
        <div class="auth-footer">Для сотрудников и кассиров.</div>
      </form>
      <form id="otpForm" class="hidden" novalidate>
        <div class="form-field">
          <label for="otpInput">Введи 4-значный код <span class="req">*</span></label>
          <input type="text" id="otpInput" class="otp-input" placeholder="0000" inputmode="numeric" maxlength="4" required>
          <div class="form-error" data-for="otpInput"></div>
        </div>
        <button class="auth-btn" type="submit" id="verifyOtpBtn">Войти в систему</button>
        <button class="auth-btn auth-btn--ghost" type="button" id="backBtn">← Изменить номер</button>
        <div class="auth-footer">Код действителен ещё <strong id="otpTimer">05:00</strong></div>
      </form>
    </div>

    <div id="emailTab" class="hidden">
      <form id="emailForm" novalidate>
        <div class="form-field">
          <label for="emailInput">Email <span class="req">*</span></label>
          <input type="email" id="emailInput" placeholder="admin@kut.local" required>
          <div class="form-error" data-for="emailInput"></div>
        </div>
        <div class="form-field">
          <label for="passwordInput">Пароль <span class="req">*</span></label>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
          <div class="form-error" data-for="passwordInput"></div>
        </div>
        <div class="forgot-link"><button type="button" id="forgotBtn">Забыли пароль?</button></div>
        <button class="auth-btn" type="submit" id="emailLoginBtn">Войти</button>
        <div class="auth-footer">Для владельцев бизнеса и супер-администратора.</div>
      </form>
    </div>

    <div class="diag" id="diagBox"><strong>Диагностика:</strong><br>ожидание...</div>
    <div class="version-badge">версия: v3.9-NOLOOP</div>
  </div>

  <script>
    (function () {
      var b = document.getElementById('error-banner');
      var d = document.getElementById('diagBox');
      window.__kutDiag = function (l) { if (d) { d.innerHTML += '<br>' + l; d.scrollTop = d.scrollHeight; } };
      window.__kutResetDiag = function () { if (d) d.innerHTML = '<strong>Диагностика:</strong>'; };
      window.addEventListener('error', function (e) {
        b.innerHTML = '<strong>JS ошибка:</strong>' + (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
        b.classList.add('is-visible');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason; var m = (r && r.message) ? r.message : String(r);
        b.innerHTML = '<strong>Promise ошибка:</strong>' + m; b.classList.add('is-visible');
      });
    })();
  </script>

  <script type="module">
    window.__kutResetDiag();
    window.__kutDiag('Модуль запущен');

    const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const authMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

    const firebaseConfig = {
      apiKey: "AIzaSyAO1MhiEWnBKhcEs64XMMPVN0GDEZFpxPg",
      authDomain: "kut-biznes.firebaseapp.com",
      projectId: "kut-biznes",
      storageBucket: "kut-biznes.firebasestorage.app",
      messagingSenderId: "699153181693",
      appId: "1:699153181693:web:2f10e57664a8a0cefc4794",
      measurementId: "G-VTZ49G265B"
    };

    const WA_CONFIG = {
      idInstance: '720122747171',
      apiToken:   '4c32b507d4b44917a123631f42e47e868a2d3ff9e3b44b82bc',
      buildUrl() { return `https://api.green-api.com/waInstance${this.idInstance}/sendMessage/${this.apiToken}`; },
    };

    const app  = appMod.initializeApp(firebaseConfig);
    const auth = authMod.getAuth(app);
    const db   = fsMod.getFirestore(app);

    window.__kutDiag('✓ Firebase: ' + firebaseConfig.projectId);

    const $ = (s) => document.querySelector(s);
    const showMessage = (t, k) => { const b = $('#authMessage'); b.textContent = t; b.className = 'auth-message ' + (k ? 'is-' + k : ''); };
    const clearMessage = () => { const b = $('#authMessage'); b.className = 'auth-message'; b.textContent = ''; };
    const setError = (id, m) => { const i = document.getElementById(id); const b = document.querySelector(`.form-error[data-for="${id}"]`); if (i) i.classList.toggle('is-invalid', !!m); if (b) b.textContent = m || ''; };
    const clearErrors = (f) => { f.querySelectorAll('.form-error').forEach(e => e.textContent = ''); f.querySelectorAll('input').forEach(i => i.classList.remove('is-invalid')); };

    function maskPhone(raw) {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('996')) d = d.slice(3); else if (d.startsWith('0')) d = d.slice(1);
      d = d.slice(0, 9);
      if (!d.length) return '';
      let o = '+996 '; if (d.length <= 3) return o + d;
      o += d.slice(0, 3) + ' '; if (d.length <= 6) return o + d.slice(3);
      o += d.slice(3, 6) + ' '; o += d.slice(6); return o;
    }
    function normalizePhone(raw) {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('996')) d = d.slice(3); else if (d.startsWith('0')) d = d.slice(1);
      return '+996' + d.slice(0, 9);
    }
    const isValidPhone = (n) => /^\+996\d{9}$/.test(n);

    function redirectByRole(p) {
      if (!p) { window.location.href = './login.html'; return; }
      if (p.active === false) { alert('Ваш аккаунт заблокирован.'); authMod.signOut(auth); return; }
      window.__kutDiag('→ Роль: ' + p.role);
      if (p.role === 'super_admin') window.location.href = './admin.html';
      else if (p.role === 'owner') window.location.href = './index.html';
      else if (p.role === 'cashier') window.location.href = './cash.html';
      else window.location.href = './index.html';
    }

    // ---- Табы ----
    const phoneTab = $('#phoneTab'), emailTab = $('#emailTab');
    document.querySelectorAll('.auth-tab').forEach(t => {
      t.addEventListener('click', () => {
        const target = t.dataset.tab;
        document.querySelectorAll('.auth-tab').forEach(x => {
          const on = x.dataset.tab === target; x.classList.toggle('is-active', on); x.setAttribute('aria-selected', String(on));
        });
        phoneTab.classList.toggle('hidden', target !== 'phone');
        emailTab.classList.toggle('hidden', target !== 'email');
        clearMessage();
      });
    });

    // ---- Вход по Email ----
    $('#emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors(e.target); clearMessage();
      window.__kutResetDiag(); window.__kutDiag('--- Вход по email ---');

      const email = $('#emailInput').value.trim();
      const password = $('#passwordInput').value;
      let ok = true;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('emailInput', 'Введите email'); ok = false; }
      if (password.length < 6) { setError('passwordInput', 'Минимум 6 символов'); ok = false; }
      if (!ok) return;

      const btn = $('#emailLoginBtn'); btn.disabled = true; btn.textContent = 'Входим...';

      let user = null;
      try {
        const cred = await authMod.signInWithEmailAndPassword(auth, email, password);
        user = cred.user;
        window.__kutDiag('✓ Auth OK. UID: ' + user.uid);
      } catch (err) {
        window.__kutDiag('✗ Auth: ' + err.code);
        showMessage('Ошибка входа: ' + err.code, 'error');
        btn.disabled = false; btn.textContent = 'Войти'; return;
      }

      let profile = null;
      try {
        const snap = await fsMod.getDoc(fsMod.doc(db, 'users', user.uid));
        if (snap.exists()) {
          profile = { uid: user.uid, ...snap.data() };
          window.__kutDiag('✓ Профиль: role=' + (profile.role || '—'));
        } else {
          window.__kutDiag('✗ users/' + user.uid + ' не найден');
        }
      } catch (err) {
        window.__kutDiag('✗ Firestore: ' + err.code);
      }

      // Автовосстановление admin
      if (!profile && email === 'admin@kut.local') {
        window.__kutDiag('→ Самовосстановление admin-профиля...');
        try {
          await fsMod.setDoc(fsMod.doc(db, 'users', user.uid), {
            email, displayName: 'Администратор', phone: '+79998485254',
            role: 'super_admin', businessId: '', active: true,
            createdAt: fsMod.serverTimestamp(),
          });
          const snap = await fsMod.getDoc(fsMod.doc(db, 'users', user.uid));
          profile = { uid: user.uid, ...snap.data() };
          window.__kutDiag('✓ Профиль admin создан');
        } catch (err) {
          window.__kutDiag('✗ Не удалось создать: ' + err.code + ' ' + err.message);
        }
      }

      if (!profile || !profile.role) {
        window.__kutDiag('✗ Профиль недоступен');
        showMessage('Профиль не найден в Firestore', 'error');
        await authMod.signOut(auth).catch(() => {});
        btn.disabled = false; btn.textContent = 'Войти'; return;
      }

      showMessage('Успешно! Переходим...', 'success');
      setTimeout(() => redirectByRole(profile), 300);
    });

    $('#forgotBtn').addEventListener('click', async () => {
      const email = $('#emailInput').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMessage('Введите email.', 'info'); return; }
      try { await authMod.sendPasswordResetEmail(auth, email); showMessage('Письмо отправлено на ' + email, 'success'); }
      catch (err) { showMessage('Не удалось отправить.', 'error'); }
    });

    // ---- OTP ----
    let currentPhone = '', otpTimerInterval = null;

    $('#phoneInput').addEventListener('input', (e) => { e.target.value = maskPhone(e.target.value); });

    $('#phoneForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors(e.target); clearMessage();
      window.__kutResetDiag(); window.__kutDiag('--- Вход по номеру ---');

      const phone = normalizePhone($('#phoneInput').value);
      if (!isValidPhone(phone)) { setError('phoneInput', 'Введите корректный номер'); return; }

      const btn = $('#sendOtpBtn'); btn.disabled = true; btn.textContent = '⏳ Отправляем...';

      try {
        const code = String(Math.floor(1000 + Math.random() * 9000));
        const expiresAt = new Date(Date.now() + 5 * 60 * 1000);
        await fsMod.setDoc(fsMod.doc(db, 'otp_sessions', phone.replace(/\D/g, '')), {
          phone, code, expiresAt, createdAt: fsMod.serverTimestamp(), attempts: 0,
        });
        window.__kutDiag('✓ OTP записан');

        const phoneDigits = phone.replace(/\D/g, '');
        const message = `Ваш код подтверждения в системе КУТ: БИЗНЕС — ${code}\n\nНикому не сообщайте этот код. Действителен 5 минут.`;
        const res = await fetch(WA_CONFIG.buildUrl(), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: `${phoneDigits}@c.us`, message }),
        });
        if (!res.ok) throw new Error('WHATSAPP_FAILED');
        window.__kutDiag('✓ WhatsApp отправлен');

        currentPhone = phone;
        showMessage('Код отправлен в WhatsApp на ' + phone, 'success');
        $('#phoneForm').classList.add('hidden');
        $('#otpForm').classList.remove('hidden');
        $('#otpInput').focus();
        startOtpTimer(300);
      } catch (err) {
        window.__kutDiag('✗ sendOtp: ' + err.message);
        showMessage('Не удалось отправить код.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = '💬 Получить код в WhatsApp';
      }
    });

    $('#otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors(e.target); clearMessage();

      const code = $('#otpInput').value.trim();
      if (!/^\d{4}$/.test(code)) { setError('otpInput', 'Введите 4-значный код'); return; }

      const btn = $('#verifyOtpBtn'); btn.disabled = true; btn.textContent = 'Проверяем...';

      try {
        const phone = normalizePhone(currentPhone);
        const ref = fsMod.doc(db, 'otp_sessions', phone.replace(/\D/g, ''));
        const snap = await fsMod.getDoc(ref);
        if (!snap.exists()) throw new Error('OTP_NOT_FOUND');

        const data = snap.data();
        let ex = data.expiresAt;
        if (ex && typeof ex.toDate === 'function') ex = ex.toDate();
        else if (ex && ex.seconds) ex = new Date(ex.seconds * 1000);
        else ex = new Date(ex);
        if (!ex || Date.now() > ex.getTime()) { await fsMod.deleteDoc(ref).catch(() => {}); throw new Error('OTP_EXPIRED'); }
        if (String(data.code) !== String(code)) throw new Error('OTP_MISMATCH');
        await fsMod.deleteDoc(ref).catch(() => {});

        const fakeEmail = phone.replace(/\D/g, '') + '@kut.local';
        const fakePassword = 'kut_' + phone.replace(/\D/g, '') + '_secret';
        let cred;
        try { cred = await authMod.signInWithEmailAndPassword(auth, fakeEmail, fakePassword); }
        catch (err) {
          if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials') {
            cred = await authMod.createUserWithEmailAndPassword(auth, fakeEmail, fakePassword);
          } else throw err;
        }
        const uid = cred.user.uid;
        let pSnap = await fsMod.getDoc(fsMod.doc(db, 'users', uid));
        if (!pSnap.exists()) {
          await fsMod.setDoc(fsMod.doc(db, 'users', uid), {
            email: fakeEmail, displayName: '', phone, role: 'cashier',
            businessId: '', active: true, createdAt: fsMod.serverTimestamp(),
          });
          pSnap = await fsMod.getDoc(fsMod.doc(db, 'users', uid));
        }
        const profile = { uid, ...pSnap.data() };
        showMessage('Успешно! Переходим...', 'success');
        setTimeout(() => redirectByRole(profile), 400);
      } catch (err) {
        window.__kutDiag('✗ verifyOtp: ' + err.message);
        let msg = 'Неверный код.';
        if (err.message === 'OTP_EXPIRED') msg = 'Код истёк.';
        else if (err.message === 'OTP_NOT_FOUND') msg = 'Код не найден.';
        showMessage(msg, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Войти в систему';
      }
    });

    $('#backBtn').addEventListener('click', () => {
      stopOtpTimer();
      $('#otpForm').classList.add('hidden');
      $('#phoneForm').classList.remove('hidden');
      $('#otpInput').value = ''; clearMessage();
    });

    function startOtpTimer(sec) {
      stopOtpTimer();
      const el = $('#otpTimer'); let l = sec;
      const tick = () => { const m = String(Math.floor(l / 60)).padStart(2, '0'); const s = String(l % 60).padStart(2, '0'); el.textContent = `${m}:${s}`; if (l <= 0) { stopOtpTimer(); el.textContent = '00:00'; } l--; };
      tick(); otpTimerInterval = setInterval(tick, 1000);
    }
    function stopOtpTimer() { if (otpTimerInterval) { clearInterval(otpTimerInterval); otpTimerInterval = null; } }

    // ВАЖНО: убрана авто-редирект-подписка onAuthStateChanged.
    // Поэтому страница не перекидывает сама — только по кнопке «Войти».

    window.__kutDiag('✓ Готово. Нажмите "Войти".');
  </script>
</body>
</html>
