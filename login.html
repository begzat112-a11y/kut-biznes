<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#005F40">
  <meta name="description" content="КУТ: БИЗНЕС — вход по WhatsApp или Email.">
  <title>Вход — КУТ: БИЗНЕС</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --kut-green: #005F40;
      --kut-green-dark: #003F2A;
      --kut-green-soft: #E6F1ED;
      --kut-gold: #D4AF37;
      --kut-gold-dark: #B8952A;
      --kut-bg: #F4F7F5;
      --kut-surface: #FFFFFF;
      --kut-border: #E3EAE6;
      --kut-text: #14211C;
      --kut-muted: #64776E;
      --kut-danger: #C0392B;
      --kut-whatsapp: #25D366;
      --shadow-lg: 0 18px 48px rgba(16,32,25,.20);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #005F40 0%, #003F2A 100%);
      color: var(--kut-text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 24px;
      padding: 28px 26px;
      box-shadow: var(--shadow-lg);
      animation: cardIn .35s cubic-bezier(.2,.9,.3,1.1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .auth-brand__mark {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--kut-green);
      color: var(--kut-gold);
      display: grid; place-items: center;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(0,95,64,.30);
    }
    .auth-brand__text { line-height: 1.15; }
    .auth-brand__text strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
      color: var(--kut-green);
      letter-spacing: -.3px;
    }
    .auth-brand__text small {
      display: block;
      font-size: 12px;
      color: var(--kut-muted);
      margin-top: 2px;
    }

    /* ========== Табы входа ========== */
    .auth-tabs {
      display: flex;
      gap: 4px;
      background: var(--kut-green-soft);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--kut-muted);
      cursor: pointer;
      transition: all .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .auth-tab:hover { color: var(--kut-green); }
    .auth-tab.is-active {
      background: #fff;
      color: var(--kut-green);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .auth-message {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }
    .auth-message.is-error {
      display: block;
      background: rgba(192,57,43,.08);
      color: var(--kut-danger);
      border: 1px solid rgba(192,57,43,.20);
    }
    .auth-message.is-success {
      display: block;
      background: rgba(30,190,90,.08);
      color: #0F7F3A;
      border: 1px solid rgba(30,190,90,.20);
    }
    .auth-message.is-info {
      display: block;
      background: var(--kut-green-soft);
      color: var(--kut-green);
      border: 1px solid rgba(0,95,64,.20);
    }

    .form-field {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--kut-text);
    }
    .form-field label .req { color: var(--kut-danger); margin-left: 2px; }
    .form-field input {
      width: 100%;
      padding: 14px 15px;
      border: 1.5px solid var(--kut-border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      color: var(--kut-text);
      outline: none;
      background: #fff;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .form-field input:focus {
      border-color: var(--kut-green);
      box-shadow: 0 0 0 4px rgba(0,95,64,.12);
    }
    .form-field input.is-invalid {
      border-color: var(--kut-danger);
      box-shadow: 0 0 0 4px rgba(192,57,43,.12);
    }
    .form-field input.otp-input {
      text-align: center;
      letter-spacing: 14px;
      font-size: 26px;
      font-weight: 700;
      padding: 16px 20px 16px 30px;
    }
    .form-error {
      font-size: 12px;
      color: var(--kut-danger);
      min-height: 14px;
      font-weight: 500;
    }

    .auth-btn {
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 14px;
      background: var(--kut-green);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,95,64,.28);
      transition: background .18s ease, transform .12s ease;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .auth-btn:hover { background: var(--kut-green-dark); }
    .auth-btn:active { transform: translateY(1px); }
    .auth-btn:disabled { opacity: .7; cursor: wait; }
    .auth-btn--whatsapp {
      background: var(--kut-whatsapp);
      box-shadow: 0 8px 20px rgba(37,211,102,.35);
    }
    .auth-btn--whatsapp:hover { background: #1EBE5A; }
    .auth-btn--ghost {
      background: transparent;
      color: var(--kut-green);
      border: 1.5px solid var(--kut-border);
      box-shadow: none;
      margin-top: 10px;
    }
    .auth-btn--ghost:hover { background: var(--kut-green-soft); }

    .auth-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--kut-muted);
      line-height: 1.4;
    }
    .auth-footer a {
      color: var(--kut-green);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .forgot-link {
      text-align: right;
      margin-top: -6px;
      margin-bottom: 8px;
    }
    .forgot-link button {
      background: transparent;
      border: none;
      color: var(--kut-green);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }
    .forgot-link button:hover { text-decoration: underline; }

    .hidden { display: none !important; }
    ::selection { background: var(--kut-gold); color: var(--kut-green-dark); }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand__mark">К</div>
      <div class="auth-brand__text">
        <strong>КУТ: БИЗНЕС</strong>
        <small>Вход в систему</small>
      </div>
    </div>

    <!-- ========== Табы ========== -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" type="button" data-tab="phone" role="tab" aria-selected="true">
        <span aria-hidden="true">📱</span> По телефону
      </button>
      <button class="auth-tab" type="button" data-tab="email" role="tab" aria-selected="false">
        <span aria-hidden="true">✉️</span> По Email
      </button>
    </div>

    <div class="auth-message" id="authMessage"></div>

    <!-- ========== ВКЛАДКА 1: ВХОД ПО ТЕЛЕФОНУ ========== -->
    <div id="phoneTab">
      <!-- ШАГ 1: Ввод номера -->
      <form id="phoneForm" novalidate>
        <div class="form-field">
          <label for="phoneInput">Номер телефона <span class="req">*</span></label>
          <input
            type="tel"
            id="phoneInput"
            placeholder="+996 700 123 456"
            inputmode="tel"
            autocomplete="tel"
            required>
          <div class="form-error" data-for="phoneInput"></div>
        </div>

        <button class="auth-btn auth-btn--whatsapp" type="submit" id="sendOtpBtn">
          <span aria-hidden="true">💬</span> Получить код в WhatsApp
        </button>

        <div class="auth-footer">
          Для сотрудников и кассиров. Код приходит в WhatsApp.
        </div>
      </form>

      <!-- ШАГ 2: Ввод OTP -->
      <form id="otpForm" class="hidden" novalidate>
        <div class="form-field">
          <label for="otpInput">Введи 4-значный код <span class="req">*</span></label>
          <input
            type="text"
            id="otpInput"
            class="otp-input"
            placeholder="0000"
            inputmode="numeric"
            maxlength="4"
            autocomplete="one-time-code"
            required>
          <div class="form-error" data-for="otpInput"></div>
        </div>

        <button class="auth-btn" type="submit" id="verifyOtpBtn">
          Войти в систему
        </button>

        <button class="auth-btn auth-btn--ghost" type="button" id="backBtn">
          ← Изменить номер
        </button>

        <div class="auth-footer" id="otpTimerWrap">
          Код действителен ещё <strong id="otpTimer">05:00</strong>
        </div>
      </form>
    </div>

    <!-- ========== ВКЛАДКА 2: ВХОД ПО EMAIL ========== -->
    <div id="emailTab" class="hidden">
      <form id="emailForm" novalidate>
        <div class="form-field">
          <label for="emailInput">Email <span class="req">*</span></label>
          <input
            type="email"
            id="emailInput"
            placeholder="owner@shop.kg"
            autocomplete="email"
            required>
          <div class="form-error" data-for="emailInput"></div>
        </div>

        <div class="form-field">
          <label for="passwordInput">Пароль <span class="req">*</span></label>
          <input
            type="password"
            id="passwordInput"
            placeholder="••••••••"
            autocomplete="current-password"
            required>
          <div class="form-error" data-for="passwordInput"></div>
        </div>

        <div class="forgot-link">
          <button type="button" id="forgotBtn">Забыли пароль?</button>
        </div>

        <button class="auth-btn" type="submit" id="emailLoginBtn">
          Войти
        </button>

        <div class="auth-footer">
          Для владельцев бизнеса и супер-администратора.
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import './js/firebase-config.js';

    const $ = (s) => document.querySelector(s);

    // =========================================================
    // УТИЛИТЫ
    // =========================================================
    function showMessage(text, kind) {
      const box = $('#authMessage');
      box.textContent = text;
      box.className = 'auth-message ' + (kind ? 'is-' + kind : '');
    }
    function clearMessage() {
      const box = $('#authMessage');
      box.className = 'auth-message';
      box.textContent = '';
    }
    function setError(fieldId, msg) {
      const input = document.getElementById(fieldId);
      const box = document.querySelector(`.form-error[data-for="${fieldId}"]`);
      if (input) input.classList.toggle('is-invalid', Boolean(msg));
      if (box) box.textContent = msg || '';
    }
    function clearErrors(form) {
      form.querySelectorAll('.form-error').forEach((e) => (e.textContent = ''));
      form.querySelectorAll('input').forEach((i) => i.classList.remove('is-invalid'));
    }

    // =========================================================
    // МАСКА ТЕЛЕФОНА +996
    // =========================================================
    function maskPhone(raw) {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('996')) d = d.slice(3);
      else if (d.startsWith('0')) d = d.slice(1);
      d = d.slice(0, 9);

      if (d.length === 0) return '';
      let out = '+996 ';
      if (d.length <= 3) return out + d;
      out += d.slice(0, 3) + ' ';
      if (d.length <= 6) return out + d.slice(3);
      out += d.slice(3, 6) + ' ';
      out += d.slice(6);
      return out;
    }

    function normalizePhone(raw) {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('996')) d = d.slice(3);
      else if (d.startsWith('0')) d = d.slice(1);
      d = d.slice(0, 9);
      return '+996' + d;
    }

    function isValidPhone(normalized) {
      return /^\+996\d{9}$/.test(normalized);
    }

    // =========================================================
    // РЕДИРЕКТ ПО РОЛИ
    // super_admin → admin.html
    // owner       → index.html
    // cashier     → cash.html
    // =========================================================
    function redirectByRole(profile) {
      if (!profile) { window.location.href = './login.html'; return; }

      if (profile.active === false) {
        showMessage('Ваш аккаунт заблокирован. Свяжитесь с администратором.', 'error');
        window.FB.logout().catch(() => {});
        return;
      }

      const role = profile.role;

      if (role === 'super_admin') {
        window.location.href = './admin.html';
        return;
      }
      if (role === 'owner') {
        window.location.href = './index.html';
        return;
      }
      if (role === 'cashier') {
        window.location.href = './cash.html';
        return;
      }
      // На случай неизвестной роли — на дашборд
      window.location.href = './index.html';
    }

    // =========================================================
    // ПЕРЕКЛЮЧЕНИЕ ТАБОВ
    // =========================================================
    const phoneTab = $('#phoneTab');
    const emailTab = $('#emailTab');

    document.querySelectorAll('.auth-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.tab;
        document.querySelectorAll('.auth-tab').forEach((t) => {
          const active = t.dataset.tab === target;
          t.classList.toggle('is-active', active);
          t.setAttribute('aria-selected', String(active));
        });
        phoneTab.classList.toggle('hidden', target !== 'phone');
        emailTab.classList.toggle('hidden', target !== 'email');
        clearMessage();
        stopOtpTimer();
      });
    });

    // =========================================================
    // ВХОД ПО ТЕЛЕФОНУ
    // =========================================================
    let currentPhone = '';
    let otpTimerInterval = null;

    const phoneForm = $('#phoneForm');
    const otpForm = $('#otpForm');
    const phoneInput = $('#phoneInput');

    phoneInput.addEventListener('input', (e) => {
      e.target.value = maskPhone(e.target.value);
    });

    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors(phoneForm);
      clearMessage();

      const phoneNorm = normalizePhone(phoneInput.value);
      if (!isValidPhone(phoneNorm)) {
        setError('phoneInput', 'Введите корректный номер (например +996 700 123 456)');
        return;
      }

      if (!window.FB || typeof window.FB.sendWhatsAppOtp !== 'function') {
        showMessage('Сервис авторизации не загружен. Обновите страницу.', 'error');
        return;
      }

      const btn = $('#sendOtpBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Отправляем код...';

      try {
        await window.FB.sendWhatsAppOtp(phoneNorm);
        currentPhone = phoneNorm;
        showMessage('Код отправлен в WhatsApp на ' + phoneNorm, 'success');
        phoneForm.classList.add('hidden');
        otpForm.classList.remove('hidden');
        $('#otpInput').focus();
        startOtpTimer(300);
      } catch (err) {
        console.error('[login] send OTP failed:', err);
        showMessage('Не удалось отправить код. Попробуйте ещё раз.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span aria-hidden="true">💬</span> Получить код в WhatsApp';
      }
    });

    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors(otpForm);
      clearMessage();

      const code = $('#otpInput').value.trim();
      if (!/^\d{4}$/.test(code)) {
        setError('otpInput', 'Введите 4-значный код');
        return;
      }

      if (!window.FB || typeof window.FB.verifyWhatsAppOtp !== 'function') {
        showMessage('Сервис авторизации не загружен. Обновите страницу.', 'error');
        return;
      }

      const btn = $('#verifyOtpBtn');
      btn.disabled = true;
      btn.textContent = 'Проверяем...';

      try {
        const { profile } = await window.FB.verifyWhatsAppOtp(currentPhone, code);

        if (!profile) {
          showMessage('Профиль не найден. Обратитесь к администратору.', 'error');
          return;
        }
        if (profile.active === false) {
          showMessage('Ваш аккаунт заблокирован. Свяжитесь с администратором.', 'error');
          await window.FB.logout().catch(() => {});
          return;
        }

        showMessage('Успешно! Перенаправляем...', 'success');
        setTimeout(() => redirectByRole(profile), 400);
      } catch (err) {
        console.error('[login] verify OTP failed:', err);
        let msg = 'Неверный код. Попробуйте ещё раз.';
        if (err.message === 'OTP_EXPIRED') msg = 'Код истёк. Запросите новый.';
        else if (err.message === 'OTP_NOT_FOUND') msg = 'Код не найден. Запросите новый.';
        else if (err.message === 'OTP_MISMATCH') msg = 'Неверный код.';
        showMessage(msg, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Войти в систему';
      }
    });

    $('#backBtn').addEventListener('click', () => {
      stopOtpTimer();
      otpForm.classList.add('hidden');
      phoneForm.classList.remove('hidden');
      $('#otpInput').value = '';
      clearErrors(otpForm);
      clearMessage();
      phoneInput.focus();
    });

    // ---------- Таймер OTP ----------
    function startOtpTimer(seconds) {
      stopOtpTimer();
      const el = $('#otpTimer');
      let left = seconds;

      const tick = () => {
        const m = String(Math.floor(left / 60)).padStart(2, '0');
        const s = String(left % 60).padStart(2, '0');
        el.textContent = `${m}:${s}`;
        if (left <= 0) {
          stopOtpTimer();
          el.textContent = '00:00';
          showMessage('Код истёк. Запросите новый.', 'error');
        }
        left--;
      };
      tick();
      otpTimerInterval = setInterval(tick, 1000);
    }
    function stopOtpTimer() {
      if (otpTimerInterval) {
        clearInterval(otpTimerInterval);
        otpTimerInterval = null;
      }
    }

    // =========================================================
    // ВХОД ПО EMAIL И ПАРОЛЮ
    // =========================================================
    const emailForm = $('#emailForm');

    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors(emailForm);
      clearMessage();

      const email = $('#emailInput').value.trim();
      const password = $('#passwordInput').value;
      let ok = true;

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setError('emailInput', 'Введите корректный email');
        ok = false;
      }
      if (password.length < 6) {
        setError('passwordInput', 'Пароль минимум 6 символов');
        ok = false;
      }
      if (!ok) return;

      if (!window.FB || typeof window.FB.login !== 'function') {
        showMessage('Сервис авторизации не загружен. Обновите страницу.', 'error');
        return;
      }

      const btn = $('#emailLoginBtn');
      btn.disabled = true;
      btn.textContent = 'Входим...';

      try {
        const { profile } = await window.FB.login(email, password);

        if (!profile) {
          showMessage('Профиль не найден. Обратитесь к администратору.', 'error');
          return;
        }
        if (profile.active === false) {
          showMessage('Ваш аккаунт заблокирован. Свяжитесь с администратором.', 'error');
          await window.FB.logout().catch(() => {});
          return;
        }

        showMessage('Успешно! Перенаправляем...', 'success');
        setTimeout(() => redirectByRole(profile), 400);
      } catch (err) {
        console.error('[login] email login failed:', err);
        let msg = 'Ошибка входа. Попробуйте ещё раз.';
        if (err.message === 'ACCOUNT_DISABLED') msg = 'Аккаунт заблокирован.';
        else if (err.code === 'auth/invalid-credential' ||
                 err.code === 'auth/wrong-password' ||
                 err.code === 'auth/invalid-login-credentials') {
          msg = 'Неверный email или пароль.';
        }
        else if (err.code === 'auth/user-not-found') msg = 'Пользователь не найден.';
        else if (err.code === 'auth/too-many-requests') msg = 'Слишком много попыток. Подождите минуту.';
        else if (err.code === 'auth/invalid-email') msg = 'Некорректный email.';
        showMessage(msg, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    });

    // ---------- Забыли пароль ----------
    $('#forgotBtn').addEventListener('click', async () => {
      const email = $('#emailInput').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage('Введите email — мы отправим ссылку для сброса пароля.', 'info');
        $('#emailInput').focus();
        return;
      }
      if (!window.FB || typeof window.FB.resetPassword !== 'function') {
        showMessage('Функция сброса пароля недоступна.', 'error');
        return;
      }
      try {
        await window.FB.resetPassword(email);
        showMessage('Письмо для сброса пароля отправлено на ' + email, 'success');
      } catch (err) {
        console.error('[login] reset password failed:', err);
        showMessage('Не удалось отправить письмо. Проверьте email.', 'error');
      }
    });

    // =========================================================
    // АВТО-РЕДИРЕКТ, ЕСЛИ УЖЕ АВТОРИЗОВАН
    // =========================================================
    (async () => {
      try {
        const { profile } = await window.FB.waitForAuth();
        if (profile && profile.active !== false) {
          // Пользователь уже вошёл — редиректим по роли
          redirectByRole(profile);
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
