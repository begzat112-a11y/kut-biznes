<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Вход — NexusBiz</title>

  <script>
    try {
      var t = localStorage.getItem('kut_theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="./css/theme.css">
  <style>
    body { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
    .login {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
    }
    .login__logo {
      width: 72px; height: 72px;
      margin: 0 auto 16px;
      border-radius: 20px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #10B981, #059669);
      color: #fff; font-size: 32px; font-weight: 800;
      box-shadow: 0 12px 32px rgba(16,185,129,.35);
    }
    .login h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
    .login p { margin: 0 0 28px; color: var(--text-muted); font-size: 14px; line-height: 1.5; }

    .auth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 54px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      font: 600 15px/1 inherit;
      font-family: inherit;
      cursor: pointer;
      transition: transform .1s, opacity .2s, background .18s;
      text-decoration: none;
    }
    .auth-btn:active { transform: scale(.98); }
    .auth-btn:disabled { opacity: .55; cursor: progress; }
    .auth-btn + .auth-btn { margin-top: 12px; }

    .auth-btn--google {
      background: #FFFFFF;
      color: #1F2937;
      border-color: #E5E7EB;
    }
    [data-theme="dark"] .auth-btn--google {
      background: #1E293B;
      color: #F1F5F9;
      border-color: rgba(255,255,255,.10);
    }

    .auth-btn--telegram {
      background: linear-gradient(135deg, #229ED9, #1C8DC2);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(34,158,217,.35);
    }
    [data-theme="dark"] .auth-btn--telegram {
      background: linear-gradient(135deg, #229ED9, #1C8DC2);
    }

    .auth-btn__icon { width: 22px; height: 22px; flex-shrink: 0; }

    .auth-btn--telegram-wrap {
      position: relative;
      margin-top: 12px;
      min-height: 54px;
    }

    #tgWidgetSlot {
      position: absolute;
      inset: 0;
      opacity: 0.001;
      overflow: hidden;
      pointer-events: auto;
      z-index: 10;
      cursor: pointer;
    }
    #tgWidgetSlot iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
    }

    .login__divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
    }
    .login__divider::before,
    .login__divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-strong);
      opacity: .5;
    }

    .login__err {
      margin-top: 20px;
      min-height: 20px;
      color: var(--debt);
      font-size: 13px;
      line-height: 1.4;
    }

    .login__foot {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .login__foot a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

  <main class="card login">
    <div class="login__logo" aria-hidden="true">N</div>
    <h1>NexusBiz</h1>
    <p>Касса, склад и долги для вашего магазина.<br>Войдите одним из способов ниже.</p>

    <!-- Google -->
    <button class="auth-btn auth-btn--google" id="googleBtn" type="button">
      <svg class="auth-btn__icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/>
        <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      <span id="googleBtnText">Войти через Google</span>
    </button>

    <div class="login__divider">или</div>

    <!-- Telegram -->
    <div class="auth-btn--telegram-wrap">
      <button class="auth-btn auth-btn--telegram" id="telegramBtn" type="button">
        <svg class="auth-btn__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.26-1.91.178-.184 3.247-2.977 3.307-3.23.007-.03.014-.143-.054-.2-.068-.058-.169-.038-.242-.022-.106.023-1.79 1.135-5.056 3.335-.477.327-.908.487-1.294.478-.426-.01-1.247-.24-1.857-.438-.75-.242-1.345-.37-1.294-.783.027-.215.32-.435.879-.66 3.432-1.494 5.72-2.48 6.866-2.957 3.27-1.36 3.948-1.597 4.39-1.604z"/>
        </svg>
        <span id="telegramBtnText">Войти через Telegram</span>
      </button>
      <div id="tgWidgetSlot"></div>
    </div>

    <div class="login__err" id="err" role="alert" aria-live="polite"></div>

    <div class="login__foot">
      Нажимая «Войти», вы соглашаетесь с правилами сервиса.<br>
      © 2026 NexusBiz
    </div>
  </main>

  <script type="module">
    const debugBox = document.createElement('pre');
    debugBox.id = 'kutDebug';
    debugBox.style.cssText = `
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 40vh;
      overflow-y: auto;
      background: rgba(0,0,0,.92);
      color: #7fffd4;
      font: 11px/1.4 monospace;
      padding: 8px 10px;
      z-index: 99999;
      margin: 0;
      border-top: 1px solid #10B981;
      white-space: pre-wrap;
      word-break: break-word;
    `;
    document.body.appendChild(debugBox);

    function log(msg, type) {
      const time = new Date().toLocaleTimeString('ru-RU');
      const color = type === 'err' ? '#FF5C5C'
                  : type === 'warn' ? '#FBBF24'
                  : '#7fffd4';
      debugBox.innerHTML += `<span style="color:${color}">[${time}] ${msg}</span>\n`;
      debugBox.scrollTop = debugBox.scrollHeight;
    }

    window.addEventListener('error', (e) => {
      log(`❌ JS ERROR: ${e.message} | ${e.filename || '?'}:${e.lineno || '?'}`, 'err');
    });
    window.addEventListener('unhandledrejection', (e) => {
      const r = e.reason;
      log(`❌ PROMISE: ${r?.code || ''} ${r?.message || r}`, 'err');
    });

    log('🔍 Старт диагностики...');

    let FB = null;
    try {
      const mod = await import('./js/firebase-config.js');
      FB = window.FB || mod;
      log('✅ firebase-config.js загружен');
    } catch (err) {
      log('❌ Ошибка загрузки firebase-config.js: ' + err.message, 'err');
      log('   → проверь, что файл на сервере не пустой и не старый', 'warn');
      throw err;
    }

    if (!FB) {
      log('❌ window.FB не определён', 'err');
      throw new Error('FB not defined');
    }

    log('✓ window.FB доступен');
    log('✓ signInWithGoogle: ' + typeof FB.signInWithGoogle);
    log('✓ signInWithTelegram: ' + typeof FB.signInWithTelegram);
    log('✓ TELEGRAM_BOT_NAME: ' + FB.TELEGRAM_BOT_NAME);

    const googleBtn  = document.getElementById('googleBtn');
    const googleTxt  = document.getElementById('googleBtnText');
    const tgBtn      = document.getElementById('telegramBtn');
    const tgTxt      = document.getElementById('telegramBtnText');
    const err        = document.getElementById('err');

    log('✓ googleBtn: ' + (googleBtn ? 'найден' : 'НЕ НАЙДЕН'));
    log('✓ telegramBtn: ' + (tgBtn ? 'найден' : 'НЕ НАЙДЕН'));

    const MESSAGES = {
      'auth/popup-closed-by-user':   'Окно входа было закрыто.',
      'auth/cancelled-popup-request':'',
      'auth/network-request-failed': 'Нет соединения с интернетом.',
      'auth/unauthorized-domain':    'Домен не добавлен в Firebase.',
      'auth/operation-not-allowed':  'Вход не включён в Firebase Console.',
      'auth/invalid-api-key':        'Неверный API-ключ Firebase.',
      'auth/api-key-not-valid':      'Неверный API-ключ Firebase.',
      'auth/configuration-not-found':'Не найдена конфигурация Firebase Auth.',
      'auth/internal-error':         'Внутренняя ошибка Firebase. Попробуйте позже.',
      'permission-denied':           'Нет доступа к базе.',
      'account-disabled':            'Аккаунт заблокирован.',
      'telegram/bad_data':           'Telegram не передал данные.',
      'telegram/expired':            'Данные Telegram устарели.',
      'telegram/password_mismatch':  'Ошибка привязки. Обратитесь к администратору.',
      'auth/email-already-in-use':   'Такой Telegram уже привязан.',
      'auth/weak-password':          'Ошибка сервера. Обратитесь к администратору.',
      'auth/invalid-email':          'Ошибка формата. Обратитесь к администратору.',
      'auth/invalid-credential':     'Неверные данные для входа.',
    };

    function showErr(code, fallback) {
      const msg = MESSAGES[code];
      err.textContent = msg !== undefined ? msg : (fallback || ('Ошибка: ' + code));
      log('⚠ ' + (code || '') + ' — ' + err.textContent, 'warn');
    }
    function clearErr() { err.textContent = ''; }

    function setGoogleBusy(on) {
      googleBtn.disabled = on;
      googleTxt.textContent = on ? 'Входим…' : 'Войти через Google';
    }
    function setTgBusy(on) {
      tgBtn.disabled = on;
      tgTxt.textContent = on ? 'Входим…' : 'Войти через Telegram';
    }

    if (googleBtn) {
      googleBtn.addEventListener('click', async () => {
        log('👉 Клик по Google');
        clearErr();
        setGoogleBusy(true);
        try {
          log('   → вызываю FB.signInWithGoogle()...');
          const res = await FB.signInWithGoogle();
          log('✓ Google signIn вернул: ' + (res ? (res.profile?.email || 'profile') : 'null'));
          if (res) FB.redirectByRole(res.profile);
        } catch (e) {
          log('❌ Google error: ' + e.code + ' — ' + e.message, 'err');
          if (e.stack) log('   ' + e.stack.split('\n').slice(0, 3).join(' | '), 'err');
          showErr(e.code, e.message);
          setGoogleBusy(false);
        }
      });
    }

    window.onTelegramAuth = async function (tgUser) {
      log('👉 Telegram callback получен');
      log('   data: ' + JSON.stringify(tgUser));
      clearErr();
      setTgBusy(true);
      try {
        const res = await FB.signInWithTelegram(tgUser);
        log('✓ Telegram signIn вернул: ' + (res ? res.profile?.uid : 'null'));
        if (res) FB.redirectByRole(res.profile);
      } catch (e) {
        log('❌ Telegram error: ' + e.code + ' — ' + e.message, 'err');
        if (e.stack) log('   ' + e.stack.split('\n').slice(0, 3).join(' | '), 'err');
        showErr(e.code, e.message);
        setTgBusy(false);
      }
    };

    if (tgBtn) {
      tgBtn.addEventListener('click', () => {
        log('👉 Клик по Telegram');
        const slot = document.getElementById('tgWidgetSlot');
        const iframe = slot?.querySelector('iframe');
        log('   iframe в слоте: ' + (iframe ? 'ЕСТЬ' : 'НЕТ'));
        if (!iframe) {
          const botName = FB.TELEGRAM_BOT_NAME || 'NexusBizIDBot';
          log('   → виджет не загружен, открываю t.me/' + botName, 'warn');
          window.open('https://t.me/' + botName, '_blank', 'noopener');
        } else {
          log('   → клик должен пройти в iframe виджета');
          log('   размер iframe: ' + iframe.offsetWidth + '×' + iframe.offsetHeight);
        }
      });
    }

    (function mountTgWidget() {
      const slot = document.getElementById('tgWidgetSlot');
      if (!slot) { log('❌ #tgWidgetSlot не найден', 'err'); return; }
      const botName = FB.TELEGRAM_BOT_NAME || 'NexusBizIDBot';
      log('📦 Монтирую виджет Telegram для @' + botName);

      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://telegram.org/js/telegram-widget.js?22';
      s.setAttribute('data-telegram-login', botName);
      s.setAttribute('data-size', 'large');
      s.setAttribute('data-onauth', 'onTelegramAuth(user)');
      s.setAttribute('data-request-access', 'write');
      s.setAttribute('data-userpic', 'false');
      s.setAttribute('data-radius', '0');
      s.onload = () => log('✓ telegram-widget.js загружен');
      s.onerror = () => log('❌ telegram-widget.js НЕ загрузился (VPN?)', 'err');
      slot.appendChild(s);
    })();

    (async function autoStart() {
      try {
        log('🔄 Проверяю redirect...');
        const redirected = await FB.handleRedirectResult();
        if (redirected) {
          log('✓ Redirect: ' + (redirected.profile?.email || 'profile'));
          FB.redirectByRole(redirected.profile);
          return;
        }
        log('🔄 Проверяю текущую сессию...');
        const { user, profile } = await FB.waitForAuth();
        log('   user: ' + (user ? user.email : 'нет'));
        log('   profile: ' + (profile ? profile.role : 'нет'));
        if (user && profile) { FB.redirectByRole(profile); return; }
        log('ℹ Сессия не найдена — показываю форму входа');
      } catch (e) {
        log('❌ autoStart: ' + e.code + ' — ' + e.message, 'err');
        if (e.stack) log('   ' + e.stack.split('\n').slice(0, 3).join(' | '), 'err');
        showErr(e.code, e.message);
      }
    })();

    log('🏁 Диагностика завершена. Жду действий...');
  </script>
</body>
</html>
